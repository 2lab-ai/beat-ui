name: Publish
# A v* tag (or a manual run) publishes @2lab.ai/beat-ui to npmjs (public) after the full gate, as 2lab-ai/ui does.
# Secret NPM_TOKEN: the 2lab-ai organization secret (npm automation token of z-2lab).
# `runner` lets a manual run go to a self-hosted runner when GitHub-hosted minutes are unavailable to the org.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label (ubuntu-latest, or a self-hosted runner label)
        default: ubuntu-latest
permissions:
  contents: read
jobs:
  publish:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Version not published yet
        run: |
          v="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "$v" version >/dev/null 2>&1; then echo "$v is already on npm"; exit 1; fi
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
