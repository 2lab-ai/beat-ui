<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>minimal — @2lab.ai/beat-ui</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4fbfb; color: #101414;
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; }
  main { width: min(92vw, 560px); }
  #code { font-size: 15px; line-height: 1.3; min-height: 230px; }
  .row { display: block; width: fit-content; white-space: pre; background: #e3f1f1; padding: 0 .16em; margin-bottom: .3em; }
  .row.land { background: #fff; }
  .cm { color: #7c9395; }
  .tok { box-shadow: inset 0 0 0 1.5px #101414; border-radius: 3px; }
  .caret { background: #101414; color: #f4fbfb; }
  .gap { height: .45em; }
  .wid { font-size: .62em; line-height: 1.16; color: #2b3535; background: #e8f8f7; border: 1px solid rgba(16,20,20,.3); padding: .5em .8em; }
  .wid .h, .wid .ph { color: #101414; } .wid .ph { background: #101414; } .wid .g { color: #a7bcbc; } .wid .ft { color: #7f9696; }
  button { font: inherit; padding: .6em 1em; background: #101414; color: #f4fbfb; border: 0; cursor: pointer; margin-bottom: 1.2em; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <button id="go">▶ play</button>
  <div id="code"></div>
  <p><a href="%BASE_URL%">beat-ui</a> · <a href="%BASE_URL%reef/">reef</a></p>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
